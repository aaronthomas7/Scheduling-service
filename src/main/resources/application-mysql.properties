# MySQL 8: run with SPRING_PROFILES_ACTIVE=mysql. Apply db/mysql-schema.sql first (ddl-auto=validate).
# Connection details come from the environment; the defaults point at a local MySQL.
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/scheduling?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
# All datetimes are stored as UTC DATETIME(6).
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
