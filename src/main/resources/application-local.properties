# Local runs without MySQL: ./mvnw spring-boot:run -Dspring-boot.run.profiles=local
# In-memory H2 in MySQL mode; the schema comes from the entities and is rebuilt on every start.
spring.datasource.url=jdbc:h2:mem:scheduling;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
# Browse the tables at http://localhost:8080/h2-console (JDBC URL above, user sa, no password).
spring.h2.console.enabled=true
