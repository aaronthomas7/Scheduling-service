spring.application.name=demo

# With no profile set, the app runs the "local" profile (in-memory H2, prefilled hosts), so a
# plain Run in the IDE or ./mvnw spring-boot:run just works. For MySQL, set
# SPRING_PROFILES_ACTIVE=mysql (see application-mysql.properties); that replaces "local" entirely.
spring.profiles.default=local

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# How many days ahead /publish-availability generates slots.
scheduling.horizon-days=30
